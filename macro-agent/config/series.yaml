# 수집할 시계열 정의
# - series_id: data/series/{series_id}.csv 파일명이자 snapshot 키
# - verified: API 메타데이터 조회(StatisticItemList / fred/series)로 코드와 이름을 확인했으면 true.
#   구축 시점(2026-10-25) 실행 환경에서 ecos.bok.or.kr / api.stlouisfed.org 접속이 차단되어
#   전부 false로 두었다. `python scripts/fetch_ecos.py --verify`, `python scripts/fetch_fred.py --verify`
#   를 실행하면 메타데이터를 조회해 이 파일의 verified 값을 갱신한다.
# - chg_type: diff (금리처럼 %p 차이, 스냅샷은 bp로도 표시) | pct (레벨 지표의 % 변화)

lookback_years: 10

series:
  # ---------------- ECOS (한국은행) ----------------
  - series_id: kr_base_rate
    name: 한국은행 기준금리
    source: ecos
    stat_code: 722Y001
    item_code: "0101000"
    cycle: M            # 일별(D) 제공 여부도 --verify로 확인할 것
    unit: "%"
    chg_type: diff
    topic_id: kr_rate
    expect_name: 기준금리
    verified: false

  - series_id: kr_call_1d
    name: 콜금리(1일, 전체거래)
    source: ecos
    stat_code: 817Y002
    item_code: "010101000"
    cycle: D
    unit: "%"
    chg_type: diff
    topic_id: kr_rate
    expect_name: 콜금리
    verified: false

  - series_id: kr_cd_91d
    name: CD 91일
    source: ecos
    stat_code: 817Y002
    item_code: "010502000"
    cycle: D
    unit: "%"
    chg_type: diff
    topic_id: kr_rate
    expect_name: CD
    verified: false

  - series_id: ktb_3y
    name: 국고채 3년
    source: ecos
    stat_code: 817Y002
    item_code: "010200000"
    cycle: D
    unit: "%"
    chg_type: diff
    topic_id: kr_govt_bond
    expect_name: 국고채(3년)
    verified: false

  - series_id: ktb_10y
    name: 국고채 10년
    source: ecos
    stat_code: 817Y002
    item_code: "010210000"
    cycle: D
    unit: "%"
    chg_type: diff
    topic_id: kr_govt_bond
    expect_name: 국고채(10년)
    verified: false

  - series_id: ktb_30y
    name: 국고채 30년
    source: ecos
    stat_code: 817Y002
    item_code: "010230000"
    cycle: D
    unit: "%"
    chg_type: diff
    topic_id: kr_govt_bond
    expect_name: 국고채(30년)
    verified: false

  - series_id: kr_corp_aa_3y
    name: 회사채 3년 AA-
    source: ecos
    stat_code: 817Y002
    item_code: "010300000"
    cycle: D
    unit: "%"
    chg_type: diff
    topic_id: kr_corp_bond
    expect_name: AA-
    verified: false

  - series_id: kr_corp_bbb_3y
    name: 회사채 3년 BBB-
    source: ecos
    stat_code: 817Y002
    item_code: "010320000"
    cycle: D
    unit: "%"
    chg_type: diff
    topic_id: kr_corp_bond
    expect_name: BBB-
    verified: false

  - series_id: krw_usd
    name: 원/달러 환율(매매기준율)
    source: ecos
    stat_code: 731Y001
    item_code: "0000001"
    cycle: D
    unit: KRW
    chg_type: pct
    topic_id: fx_krwusd
    expect_name: 미국달러
    verified: false

  - series_id: kr_cpi
    name: 소비자물가지수(총지수)
    source: ecos
    stat_code: 901Y009
    item_code: "0"
    cycle: M
    unit: index
    chg_type: pct
    topic_id: kr_rate
    expect_name: 총지수
    verified: false

  # ---------------- FRED ----------------
  - {series_id: us_ffr_upper, name: FFR 목표 상단, source: fred, code: DFEDTARU, cycle: D, unit: "%", chg_type: diff, topic_id: us_rate, verified: false}
  - {series_id: us_ffr_lower, name: FFR 목표 하단, source: fred, code: DFEDTARL, cycle: D, unit: "%", chg_type: diff, topic_id: us_rate, verified: false}
  - {series_id: us_eff_ffr, name: 실효 연방기금금리(EFFR), source: fred, code: DFF, cycle: D, unit: "%", chg_type: diff, topic_id: us_rate, verified: false}
  - {series_id: ust_2y, name: UST 2년, source: fred, code: DGS2, cycle: D, unit: "%", chg_type: diff, topic_id: us_treasury, verified: false}
  - {series_id: ust_10y, name: UST 10년, source: fred, code: DGS10, cycle: D, unit: "%", chg_type: diff, topic_id: us_treasury, verified: false}
  - {series_id: ust_30y, name: UST 30년, source: fred, code: DGS30, cycle: D, unit: "%", chg_type: diff, topic_id: us_treasury, verified: false}
  - {series_id: ust_10y_2y_fred, name: UST 10Y-2Y (FRED 공식), source: fred, code: T10Y2Y, cycle: D, unit: "%", chg_type: diff, topic_id: us_treasury, verified: false}
  - {series_id: us_bei_10y, name: 10년 기대인플레이션(BEI), source: fred, code: T10YIE, cycle: D, unit: "%", chg_type: diff, topic_id: us_treasury, verified: false}
  - {series_id: us_ig_oas, name: ICE BofA US IG OAS, source: fred, code: BAMLC0A0CM, cycle: D, unit: "%", chg_type: diff, topic_id: us_corp_bond, verified: false}
  - {series_id: us_hy_oas, name: ICE BofA US HY OAS, source: fred, code: BAMLH0A0HYM2, cycle: D, unit: "%", chg_type: diff, topic_id: us_corp_bond, verified: false}
  - {series_id: wti, name: WTI 현물, source: fred, code: DCOILWTICO, cycle: D, unit: USD/bbl, chg_type: pct, topic_id: oil, verified: false}
  - {series_id: brent, name: Brent 현물, source: fred, code: DCOILBRENTEU, cycle: D, unit: USD/bbl, chg_type: pct, topic_id: oil, verified: false}
  - {series_id: usd_broad_index, name: 달러 지수(Nominal Broad, DXY 대용), source: fred, code: DTWEXBGS, cycle: D, unit: index, chg_type: pct, topic_id: fx_krwusd, verified: false}
  - {series_id: krw_usd_fred, name: 원/달러(FRED, 교차검증용), source: fred, code: DEXKOUS, cycle: D, unit: KRW, chg_type: pct, topic_id: fx_krwusd, verified: false}

  # ---------------- EIA (선택) ----------------
  - {series_id: us_crude_stocks, name: 미국 상업용 원유 재고(SPR 제외), source: eia, code: PET.WCESTUS1.W, cycle: W, unit: 천배럴, chg_type: pct, topic_id: oil, optional: true, verified: false}

# 파생지표 (fetch_all.py가 계산). formula: a - b, 결과 단위 %p (snapshot에는 bp도 함께)
derived:
  - {series_id: ktb_10y_3y, name: 국고채 10Y-3Y, a: ktb_10y, b: ktb_3y, topic_id: kr_govt_bond}
  - {series_id: kr_aa_spread, name: 회사채 AA- − 국고채 3Y 스프레드, a: kr_corp_aa_3y, b: ktb_3y, topic_id: kr_corp_bond}
  - {series_id: kr_bbb_aa_spread, name: 회사채 BBB- − AA- 스프레드, a: kr_corp_bbb_3y, b: kr_corp_aa_3y, topic_id: kr_corp_bond}
  - {series_id: ust_10y_2y, name: UST 10Y-2Y, a: ust_10y, b: ust_2y, topic_id: us_treasury}
  - {series_id: kr_us_10y_diff, name: 한미 10년 금리차(KTB−UST), a: ktb_10y, b: ust_10y, topic_id: fx_krwusd}
  - {series_id: kr_us_policy_diff, name: 한미 기준금리차(한은−FFR 상단), a: kr_base_rate, b: us_ffr_upper, topic_id: fx_krwusd, ffill: true}

